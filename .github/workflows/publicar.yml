name: Publicar

# En cualquier rama: tests. Solo en main, y si todo pasa: publica en Firebase.
on:
  push:
  workflow_dispatch:

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web:
    name: Tests web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (Vitest)
        run: npm test
      - name: Build de funciones
        run: npm run build --prefix functions
      - name: Recorridos (Playwright, modo prueba)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: e2e/capturas
          if-no-files-found: ignore
          retention-days: 14

  reglas:
    name: Tests de reglas (emulador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:reglas

  apk:
    name: APK de Android (testers)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Proyecto Android al día
        run: |
          # La APK abre la app publicada (server.url); igual Capacitor pide la carpeta dist.
          mkdir -p dist && [ -f dist/index.html ] || echo '<!doctype html><title>Stoica</title>' > dist/index.html
          npx cap sync android
      - name: Configuración de Firebase y llave de firma (desde los secretos)
        env:
          GOOGLE_SERVICES: ${{ secrets.ANDROID_GOOGLE_SERVICES }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          falta=""
          [ -n "$GOOGLE_SERVICES" ] || falta="$falta ANDROID_GOOGLE_SERVICES"
          [ -n "$KEYSTORE" ] || falta="$falta ANDROID_KEYSTORE"
          [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || falta="$falta ANDROID_KEYSTORE_PASSWORD"
          [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] || falta="$falta ANDROID_KEY_ALIAS"
          if [ -n "$falta" ]; then echo "::error title=Faltan secretos de la APK::$falta"; exit 1; fi
          printf '%s' "$GOOGLE_SERVICES" > android/app/google-services.json
          # La llave llega como texto (base64, de certutil): se quitan saltos de línea y encabezados.
          printf '%s' "$KEYSTORE" | tr -d '\r' | grep -v -- '-----' | tr -d '\n ' | base64 -d > "$RUNNER_TEMP/stoica.jks"
          if ! python3 -c "import json;json.load(open('android/app/google-services.json'))" 2>/dev/null; then echo "::error title=google-services.json inválido::El secreto ANDROID_GOOGLE_SERVICES no es un JSON válido. Copiá el archivo completo."; exit 1; fi
          if ! grep -q '"app.stoica"' android/app/google-services.json; then echo "::error title=google-services.json de otra app::El archivo no tiene la app app.stoica. Registrá la app Android con ese nombre de paquete."; exit 1; fi
          keytool -list -keystore "$RUNNER_TEMP/stoica.jks" -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > /dev/null 2>keytool.err || { echo "::error title=Llave de firma::No se pudo abrir la llave: revisá ANDROID_KEYSTORE (texto completo de stoica.txt) y ANDROID_KEYSTORE_PASSWORD."; exit 1; }
      - name: Compilar la APK firmada
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/stoica.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          if ! ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle.log; then
            resumen=$(grep -E 'error|Error|FAILURE|What went wrong' -A3 ../gradle.log | tail -n 30 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=La APK no compiló::${resumen}"
            exit 1
          fi
          cd ..
          mkdir -p salida-apk
          cp android/app/build/outputs/apk/release/app-release.apk salida-apk/stoica.apk
          echo '{"codigo": ${{ github.run_number }}, "nombre": "1.0.${{ github.run_number }}", "url": "/descargas/stoica.apk"}' > salida-apk/android-version.json
          ls -la salida-apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: salida-apk
          retention-days: 30

  publicar:
    name: Publicar en Firebase
    # La APK no frena la publicación de la web: si falló, se publica igual (sin APK nueva).
    needs: [web, reglas, apk]
    if: always() && github.ref == 'refs/heads/main' && needs.web.result == 'success' && needs.reglas.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://stoica-app.web.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Variables de la web
        run: |
          {
            echo "VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}"
            echo "VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}"
            echo "VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}"
            echo "VITE_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}"
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}"
            echo "VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}"
            echo "VITE_FIREBASE_VAPID_KEY=${{ vars.VITE_FIREBASE_VAPID_KEY || secrets.VITE_FIREBASE_VAPID_KEY }}"
            echo "VITE_RECAPTCHA_SITE_KEY=${{ vars.VITE_RECAPTCHA_SITE_KEY }}"
          } > .env.production
      - name: Build
        run: npm run build
      - name: Traer la APK (si se compiló)
        if: needs.apk.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: salida-apk
      - name: Poner la APK en la web (/descargas/stoica.apk)
        if: needs.apk.result == 'success'
        run: |
          mkdir -p dist/descargas
          cp salida-apk/stoica.apk dist/descargas/stoica.apk
          cp salida-apk/android-version.json dist/android-version.json
      - name: Parámetros de las funciones
        run: |
          echo "ADMIN_EMAIL=${{ vars.ADMIN_EMAIL }}" > functions/.env
          echo "EXIGIR_APP_CHECK=${{ vars.EXIGIR_APP_CHECK || 'false' }}" >> functions/.env
      - name: Credenciales de Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy (hosting, reglas, índices y funciones)
        run: |
          set -o pipefail
          intentar() { npx firebase deploy --only hosting,firestore,functions --project ${{ vars.VITE_FIREBASE_PROJECT_ID }} --non-interactive --force 2>&1 | tee deploy.log; }
          # La primera publicación de funciones a veces falla mientras Google propaga permisos internos: se reintenta una vez.
          if ! intentar; then
            echo "Primer intento falló; reintento en 60 segundos."
            sleep 60
            if ! intentar; then
              # Deja el final del error como anotación (se ve en el resumen de la ejecución).
              resumen=$(grep -v '^\s*$' deploy.log | tail -n 25 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=Deploy falló::${resumen}"
              exit 1
            fi
          fi
