<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Hábitos, disciplina y una vida más serena.">
<meta name="theme-color" content="#14120E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stoica">
<title>Stoica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap">
<style>
/* Layout: una sola columna de app móvil (máx. 480px), barra de navegación fija abajo, hojas que suben desde abajo. */
:root{
  --bg:#F5F0E6;--nav:#EFE8DA;--sf:#FBF8F1;--sh:#FBF8F1;--hover:#ECE4D4;
  --ln:#DCD1BB;--ln2:#E6DDCB;--ln3:#CBBEA3;--ln4:#B3A27E;--chk:#9E8F70;
  --tx:#16120D;--tx2:#2B261E;--mu:#4A4337;--mu2:#5A5244;--mu3:#958A74;
  --ok:#3F6E38;--okbg:#DCE9D3;--okbd:#86AD79;--oktx:#24421F;
  --miss:#9C3F2E;--missbg:#F4DED6;--missbd:#D49A8B;--misstx:#6A2619;
  --gold:#7E5D22;--goldh:#674B1A;--goldbg:#EADBB8;--goldtx:#4E3912;--on:#FBF8F1;
  --dangln:#E3BFB2;--ov:rgba(40,32,20,.45);
  --sab:#3B6290;--cor:#A2472C;--jus:#7E5D22;--tem:#4A7541;
  --f-display:'Playfair Display',Georgia,'Times New Roman',serif;
  --f-body:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14120E;--nav:#110F0B;--sf:#1A1812;--sh:#1C1A14;--hover:#1E1B16;
  --ln:#302B23;--ln2:#26221B;--ln3:#40382C;--ln4:#564A36;--chk:#6E624C;
  --tx:#F3EDDF;--tx2:#DDD6C6;--mu:#BDB5A4;--mu2:#A39B89;--mu3:#6E685C;
  --ok:#86B07E;--okbg:#233221;--okbd:#5E8A56;--oktx:#D3E8CC;
  --miss:#CF8473;--missbg:#3A2420;--missbd:#80493C;--misstx:#EEC3B8;
  --gold:#C9A66B;--goldh:#DDBE85;--goldbg:#3A3122;--goldtx:#F0DDB4;--on:#14120E;
  --dangln:#5A3328;--ov:rgba(8,7,5,.78);
  --sab:#A9C0DC;--cor:#E2A48C;--jus:#D9BA82;--tem:#A9C6A0;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14120E;--nav:#110F0B;--sf:#1A1812;--sh:#1C1A14;--hover:#1E1B16;
  --ln:#302B23;--ln2:#26221B;--ln3:#40382C;--ln4:#564A36;--chk:#6E624C;
  --tx:#F3EDDF;--tx2:#DDD6C6;--mu:#BDB5A4;--mu2:#A39B89;--mu3:#6E685C;
  --ok:#86B07E;--okbg:#233221;--okbd:#5E8A56;--oktx:#D3E8CC;
  --miss:#CF8473;--missbg:#3A2420;--missbd:#80493C;--misstx:#EEC3B8;
  --gold:#C9A66B;--goldh:#DDBE85;--goldbg:#3A3122;--goldtx:#F0DDB4;--on:#14120E;
  --dangln:#5A3328;--ov:rgba(8,7,5,.78);
  --sab:#A9C0DC;--cor:#E2A48C;--jus:#D9BA82;--tem:#A9C6A0;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--tx);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
input,textarea,select{font:inherit;color:var(--tx)}
#app{max-width:480px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:28px 120px;min-height:100%}
#app.full{padding-bottom:40px}
#app.nonav{padding-bottom:40px}
.serif{font-family:var(--f-display);font-weight:600}
.num{font-family:var(--f-display);font-weight:600;font-variant-numeric:lining-nums tabular-nums}
.cap{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.title{font-family:var(--f-display);font-size:36px;font-weight:700;margin:6px 0 0;line-height:1.1;text-wrap:balance}
.lead{font-size:15px;font-weight:500;color:var(--mu);margin-top:6px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.gold{color:var(--gold)}.mu{color:var(--mu)}.okc{color:var(--ok)}.badc{color:var(--miss)}
.ico{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--gold);flex:none}
.ico:hover{background:var(--hover)}
.ico svg,.uic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ring{border:1px solid var(--ln4)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--goldbg);color:var(--goldtx);font-family:var(--f-display);font-size:18px;font-weight:700;border:1px solid var(--ln4);flex:none}
.grp{display:flex;align-items:center;gap:10px;margin:26px 0 4px;color:var(--gold)}
.grp::after{content:"";flex:1;height:1px;background:var(--ln)}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln2)}
.item-main{display:flex;align-items:center;gap:14px;flex:1;min-width:0;text-align:left;min-height:48px}
.nm{display:block;font-size:16px;font-weight:600;color:var(--tx);overflow-wrap:anywhere}
.sub{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:5px}
.is-done .item-main{opacity:.62}
.strike .nm{text-decoration:line-through}
.dia{width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:none;margin:-6px -8px -6px 0}
.dia>span{width:22px;height:22px;transform:rotate(45deg);border:1.5px solid var(--chk);display:flex;align-items:center;justify-content:center;border-radius:3px}
.dia svg{transform:rotate(-45deg);opacity:0;fill:none;stroke:var(--on);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.dia.ok>span{background:var(--ok);border-color:var(--ok)}.dia.ok svg{opacity:1}
.dia.bad>span{background:var(--missbg);border-color:var(--miss)}
.pill{height:38px;min-width:64px;padding:0 12px;border-radius:19px;border:1.5px solid var(--ln4);color:var(--gold);font-size:13.5px;font-weight:700;flex:none;white-space:nowrap}
.pill.ok{background:var(--okbg);border-color:var(--okbd);color:var(--oktx)}
.pill.bad{background:var(--missbg);border-color:var(--missbd);color:var(--misstx)}
.plus{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--gold);background:var(--gold);color:var(--on);display:inline-flex;align-items:center;justify-content:center;flex:none}
.plus.ok{background:var(--okbg);border-color:var(--okbd);color:var(--ok)}
.plus.off{background:transparent;border-color:var(--ln3);color:var(--mu3)}
.plus svg{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.counter{display:flex;align-items:center;gap:8px;flex:none}
.counter .val{min-height:44px;padding:0 2px;white-space:nowrap}
.segs{display:flex;gap:3px;margin-top:8px;max-width:170px}
.segs i{flex:1;height:5px;border-radius:2px;background:var(--ln3)}
.segs i.f{background:var(--gold)}.segs.ok i.f{background:var(--ok)}.segs.bad i{background:var(--missbd)}.segs.bad i.f{background:var(--gold)}
.card{border:1px solid var(--ln);border-radius:10px;background:var(--sf)}
.dbl{border-top:1px solid var(--ln3);border-bottom:1px solid var(--ln3);padding:3px 0;margin-top:24px}
.dbl>div{border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:18px 8px;text-align:center}
.quote{font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.5;text-wrap:balance}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:22px;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.strip button{height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative;color:var(--tx2)}
.strip button.fut{color:var(--mu3)}.strip button.on{color:var(--gold)}
.strip button.on::after{content:"";position:absolute;bottom:-1px;left:22%;right:22%;height:2px;background:var(--gold)}
.strip .dot{width:5px;height:5px;transform:rotate(45deg)}.strip .dot.ok{background:var(--ok)}
.bar{height:4px;border-radius:2px;background:var(--ln);margin-top:8px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--ok);border-radius:2px}
.hic{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--vc);background:color-mix(in srgb,var(--vc) 12%,transparent);border:1px solid color-mix(in srgb,var(--vc) 50%,transparent)}
.hic svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.v-sabiduria{--vc:var(--sab)}.v-coraje{--vc:var(--cor)}.v-justicia{--vc:var(--jus)}.v-templanza{--vc:var(--tem)}
.vt{color:var(--vc)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:18px}
.week button{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:44px}
.week .cp{width:100%;height:3px;border-radius:1px;background:var(--ln3)}
.week .bx{width:70%;height:34px;border-radius:3px;border:1.5px solid var(--ln3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--mu)}
.week .t .bx,.week .t .cp{border-color:var(--mu2);background:transparent}.week .t .cp{background:var(--mu2)}
.week .ok .bx{background:var(--okbg);border-color:var(--okbd);color:var(--ok)}.week .ok .cp{background:var(--ok)}
.week .bad .bx{background:var(--missbg);border-color:var(--missbd);color:var(--miss)}.week .bad .cp{background:var(--miss)}
.week .lb{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mu)}.week .t .lb{color:var(--tx)}
.foot{display:flex;align-items:center;border-top:1px solid var(--ln);margin-top:14px}
.foot .cap{font-size:11px}
.link{min-height:44px;padding:0 10px;color:var(--gold)}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--ln);margin-top:16px;overflow-x:auto}
.tabs button{height:44px;position:relative;color:var(--mu2);white-space:nowrap}
.tabs button.on{color:var(--tx)}.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--gold)}
.btn{height:52px;border-radius:26px;border:1px solid var(--gold);color:var(--on);background:var(--gold);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;width:100%}
.btn:hover{background:var(--goldh)}
.ghost{min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--ln4);color:var(--gold);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.ghost:hover{background:var(--hover)}
.ghost.danger{border-color:var(--dangln);color:var(--cor)}
.inp{width:100%;height:50px;border:0;border-bottom:1px solid var(--ln3);background:transparent;padding:0 2px;font-size:16px;border-radius:0}
.inp:focus{outline:none;border-bottom-color:var(--gold)}
.fi{width:100%;height:46px;border:1px solid var(--ln3);border-radius:10px;background:transparent;padding:0 12px;font-size:16px;font-weight:500}
.fi:focus{outline:none;border-color:var(--gold)}
input::placeholder,textarea::placeholder{color:var(--mu2)}
.fl{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.lbl{display:block;margin:22px 0 8px;color:var(--mu)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sw{width:48px;height:28px;border-radius:14px;position:relative;flex:none;border:1px solid var(--ln4)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mu2);transition:left .15s}
.sw.on{background:var(--goldbg)}.sw.on::after{left:23px;background:var(--gold)}
.row{display:flex;align-items:center;gap:14px;min-height:56px;border-bottom:1px solid var(--ln2);width:100%;text-align:left;font-size:15px;font-weight:600}
.seg3{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:1px solid var(--ln3);border-radius:22px;padding:3px;gap:3px}
.seg3 button{min-height:38px;border-radius:18px;font-size:12.5px;font-weight:700;color:var(--tx2);padding:0 4px}
.seg3 button.on{background:var(--gold);color:var(--on)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--ln3);font-size:13px;font-weight:600;color:var(--tx2)}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--on)}
.chip.add{border-color:var(--ln4);color:var(--gold)}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mu)}
.lg i{width:12px;height:12px;border-radius:3px;border:1px solid}
.legend{display:flex;gap:18px;margin-top:12px;justify-content:center;flex-wrap:wrap}
.calh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px}
.calh .cap{font-size:10.5px;text-align:center;color:var(--mu2);height:22px}
.calh button{height:48px;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tx2);font-family:var(--f-display);font-weight:600;font-size:16px}
.calh button.fut{color:var(--mu3)}
.calh button.ok{background:var(--okbg);color:var(--oktx)}.calh button.bad{background:var(--missbg);color:var(--misstx)}
.calh button.t{box-shadow:inset 0 0 0 1.5px var(--gold)}
.calh .mk{font-family:var(--f-body);font-size:10px;font-weight:700;height:11px;line-height:11px}
.calh .ok .mk{color:var(--ok)}.calh .bad .mk{color:var(--miss)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--ln);margin-top:18px}
.stats.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stats>div{padding:16px 0 16px 14px;border-bottom:1px solid var(--ln);border-left:1px solid var(--ln);min-width:0}
.stats>div:nth-child(2n+1){padding-left:0;border-left:0}
.stats.s3>div{border-left:1px solid var(--ln);padding-left:12px}
.stats.s3>div:nth-child(3n+1){padding-left:0;border-left:0}
.stats .v{font-size:28px;margin-top:4px}.stats.s3 .v{font-size:21px}
.stats .r{font-size:10.5px;color:var(--mu2);margin-top:2px}
.today-box{margin-top:18px;padding:20px 18px 18px;text-align:center}
.today-box.ok{background:var(--okbg);border-color:var(--okbd)}
.bigplus{width:80px;height:80px;border-radius:50%;background:var(--gold);border:1.5px solid var(--gold);color:var(--on);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px var(--sf),0 0 0 7px var(--ln4)}
.ok .bigplus{background:var(--okbg);border-color:var(--ok);color:var(--ok);box-shadow:0 0 0 6px var(--okbg),0 0 0 7px var(--okbd)}
.bigplus svg,.minus svg{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.minus{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--ln4);color:var(--gold);display:inline-flex;align-items:center;justify-content:center}
.minus:disabled{opacity:.35}
.chart{display:block;width:100%;height:auto;margin-top:10px}
.chart text{font-family:var(--f-body)}
.empty{padding:28px 20px;text-align:center;margin-top:22px}
.empty p{color:var(--mu);font-weight:500;margin:8px 0 18px}
nav.tab{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tab>div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:4px 6px 10px}
nav.tab button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11.5px;font-weight:600;min-height:58px;position:relative;color:var(--mu2)}
nav.tab button.on{color:var(--gold)}
nav.tab button.on::before{content:"";position:absolute;top:0;width:22px;height:2px;border-radius:1px;background:var(--gold)}
nav.tab svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.overlay{position:fixed;inset:0;z-index:40;background:var(--ov);display:flex;align-items:flex-end;justify-content:center}
.overlay .scrim{position:absolute;inset:0}
.sheet{position:relative;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--sh);border-top:1px solid var(--ln3);border-radius:18px 18px 0 0;padding:14px max(22px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px))}
.sheet .grab{width:36px;height:3px;border-radius:2px;background:var(--ln3);margin:0 auto 18px}
.center{align-items:center;padding:24px}
.dialog{position:relative;width:100%;max-width:400px;background:var(--sf);border:1px solid var(--ln3);border-radius:14px;text-align:center;padding:30px 24px 20px}
.stp{width:46px;height:46px;border-radius:50%;border:1px solid var(--ln4);color:var(--gold);font-size:22px;font-weight:600;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:13.5px;font-weight:600;max-width:calc(100% - 32px)}
.err{color:var(--cor);font-size:13px;font-weight:600;margin-top:10px;min-height:18px}
.auth{max-width:420px;margin:0 auto;padding-top:24px}
.icgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.icgrid button{height:54px;border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--ln2)}
.icgrid button.on{box-shadow:inset 0 0 0 1.5px var(--gold)}
.vrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln2);width:100%;text-align:left}
.vrow .dm{width:10px;height:10px;transform:rotate(45deg);border:1px solid var(--vc);flex:none;margin:0 6px}
.vrow.on .dm{background:var(--vc)}
textarea.json{width:100%;height:220px;border:1px solid var(--ln3);border-radius:10px;background:transparent;padding:10px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
.ticks line{stroke:var(--ln3)}.ticks line.mj{stroke:var(--ln4)}.ticks line.lit{stroke:var(--gold)}

/* ---------- Movimiento ---------- */
:root{--ease:cubic-bezier(.2,.75,.25,1);--spring:cubic-bezier(.34,1.56,.64,1)}
button,a,.chip,.ghost,.btn,.pill,.plus,.row,.card{transition:background-color .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease),opacity .18s var(--ease),transform .12s var(--ease)}
button:active:not(:disabled){transform:scale(.97)}
.item-main:active:not(:disabled),.row:active:not(:disabled){transform:none;opacity:.75}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes down{from{transform:none}to{transform:translateY(100%)}}
@keyframes popin{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes popout{to{opacity:0;transform:translateY(8px) scale(.97)}}
@keyframes pop{0%{transform:scale(.72)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes toast{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
#app.enter{animation:enter .32s var(--ease) both}
.fadein{animation:fade .26s var(--ease) both}
.overlay.anim{animation:fade .22s var(--ease) both}
.overlay.anim .sheet{animation:up .34s var(--ease) both}
.overlay.anim .dialog{animation:popin .34s var(--spring) both}
.overlay.closing{animation:fadeout .2s var(--ease) forwards}
.overlay.closing .sheet{animation:down .22s var(--ease) forwards}
.overlay.closing .dialog{animation:popout .18s var(--ease) forwards}
.pop{animation:pop .38s var(--spring)}
.toast{animation:toast .28s var(--ease) both}
.item{transition:opacity .2s var(--ease)}
.desk{display:none!important}

/* ---------- Tablet ---------- */
@media (min-width:600px){
  #app{max-width:640px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
  nav.tab>div{max-width:640px}
}
/* ---------- Hojas como diálogo en pantallas grandes ---------- */
@media (min-width:700px){
  .overlay{align-items:center;padding:24px}
  .sheet{max-width:480px;border-radius:16px;border:1px solid var(--ln3);padding:22px 26px 26px;max-height:calc(100vh - 48px)}
  .sheet .grab{display:none}
  .overlay.anim .sheet{animation:popin .3s var(--spring) both}
  .overlay.closing .sheet{animation:popout .18s var(--ease) forwards}
  .toast{bottom:32px}
}
/* ---------- Escritorio: barra lateral ---------- */
@media (min-width:960px){
  body{padding-left:248px}
  #app{max-width:1000px;padding-block:48px 64px;padding-left:48px;padding-right:48px}
  #app.narrow{max-width:720px}
  .desk{display:block!important}
  nav.tab .brand.desk{display:flex!important}
  .mob{display:none!important}
  nav.tab{top:0;bottom:0;right:auto;width:248px;border-top:0;border-right:1px solid var(--ln);padding:28px 16px 20px;display:flex;flex-direction:column}
  nav.tab>div{display:flex;flex-direction:column;gap:2px;max-width:none;margin:0;padding:0}
  nav.tab button{flex-direction:row;justify-content:flex-start;gap:14px;min-height:46px;padding:0 14px;border-radius:10px;font-size:14.5px;color:var(--mu)}
  nav.tab button:hover{background:var(--hover);color:var(--tx)}
  nav.tab button.on{background:var(--goldbg);color:var(--goldtx)}
  nav.tab button.on::before{display:none}
  nav.tab .brand{display:flex;flex-direction:row;align-items:center;gap:10px;padding:0 10px 26px}
  nav.tab .me{margin-top:auto;border-top:1px solid var(--ln);padding-top:14px}
  nav.tab .me button{width:100%}
  .today-grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:48px;align-items:start;margin-top:8px}
  .today-grid>aside{position:sticky;top:32px}
  .hgrid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .item-main:hover .nm{color:var(--gold)}
  .card[data-a]:hover,.row:hover{background:var(--hover)}
  .auth{padding-top:8vh}
}
@media (min-width:960px) and (max-width:1180px){ .today-grid{grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:36px} }
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

async function hashPass(pass, salt) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pass));
    return 'sha256:' + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 5381; const s = salt + ':' + pass; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return 'djb2:' + (h >>> 0).toString(16);
  }
}

async function register(name, email, pass) {
  email = email.trim().toLowerCase();
  if (!name.trim()) return 'Escribí tu nombre.';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return 'Ese correo no parece válido.';
  if (pass.length < 6) return 'La contraseña necesita al menos 6 caracteres.';
  if (rows('users', u => u.email === email).length) return 'Ya existe una cuenta con ese correo. Entrá con tu contraseña.';

  defaultSettings(u.id);
  db.session.user_id = u.id; flush();
  return null;
}
async function login(email, pass) {
  email = email.trim().toLowerCase();
  const u = rows('users', x => x.email === email)[0];
  if (!u) return 'No hay ninguna cuenta con ese correo en este dispositivo.';
  if (await hashPass(pass, u.password_salt) !== u.password_hash) return 'La contraseña no coincide.';
  update('users', u.id, { last_login_at: nowIso() });
  db.session.user_id = u.id; flush();
  return null;
}

let idx = null;
function buildIndex() {
  const u = me(); if (!u) { idx = null; return; }
  const habits = rows('habits', h => h.user_id === u.id && !h.archived_at).sort((a, b) => a.sort_order - b.sort_order);
  const hid = new Set(habits.map(h => h.id));
  const logs = {}; rows('habit_logs', l => hid.has(l.habit_id)).forEach(l => { (logs[l.habit_id] = logs[l.habit_id] || {})[l.log_date] = l; });
  const rem = {}; rows('habit_reminders', r => hid.has(r.habit_id) && r.enabled).forEach(r => { if (!rem[r.habit_id] || r.remind_at < rem[r.habit_id]) rem[r.habit_id] = r.remind_at; });
  const metrics = {}; rows('habit_metrics', m => hid.has(m.habit_id) && !m.archived_at).forEach(m => (metrics[m.habit_id] = metrics[m.habit_id] || []).push(m));
  Object.values(metrics).forEach(a => a.sort((x, y) => x.position - y.position));
  const meas = {}; rows('habit_measurements', x => hid.has(x.habit_id)).forEach(x => (meas[x.metric_id] = meas[x.metric_id] || []).push(x));
  Object.values(meas).forEach(a => a.sort((x, y) => x.measured_on < y.measured_on ? -1 : 1));
  const tasks = rows('tasks', t => t.user_id === u.id).sort((a, b) => a.sort_order - b.sort_order);
  const comp = {}; rows('task_completions', c => c.user_id === u.id).forEach(c => (comp[c.task_id] = comp[c.task_id] || {})[c.occurrence_date] = c);
  idx = { u, habits, logs, rem, metrics, meas, tasks, comp };
}
const habitById = id => idx.habits.find(h => h.id === id);
const logOf = (h, k) => (idx.logs[h.id] || {})[k];
const isDone = (h, k) => { const l = logOf(h, k); return !!(l && l.status === 'done'); };
const valOf = (h, k) => { const l = logOf(h, k); return l && l.value != null ? +l.value : 0; };
const remindOf = h => idx.rem[h.id] || '';
const metricsOf = h => idx.metrics[h.id] || [];
const series = m => (idx.meas[m.id] || []).map(x => ({ k: x.measured_on, v: +x.value, id: x.id }));
const startOf = m => { if (m.start_value != null && m.start_value !== '' && !isNaN(m.start_value)) return +m.start_value; const s = series(m); return s.length ? s[0].v : null; };
const missed = (h, k) => !isDone(h, k) && k < todayK() && k >= (h.start_date || '0000');
function streakOf(h) { let s = 0, off = isDone(h, todayK()) ? 0 : -1; while (isDone(h, key(dayOff(off)))) { s++; off--; } return s; }
function bestOf(h) { const ks = Object.keys(idx.logs[h.id] || {}).filter(k => isDone(h, k)).sort(); let b = 0, c = 0, prev = null; ks.forEach(k => { const d = dn(k); c = (prev != null && d === prev + 1) ? c + 1 : 1; prev = d; if (c > b) b = c; }); return b; }
function rateOf(h) { let n = 0; for (let off = -29; off <= 0; off++) if (isDone(h, key(dayOff(off)))) n++; return Math.round(n / 30 * 100); }
const stepOf = (unit, type) => { if (type === 'count') return 1; const u = (unit || '').toLowerCase(); return (u === 'kg' || u === 'lb' || u === '%') ? 0.1 : (u === 'cm' || u === 'h' || u === 'km') ? 0.5 : 1; };
const taskDone = (t, k) => t.kind === 'one_off' ? Object.keys(idx.comp[t.id] || {}).length > 0 : !!(idx.comp[t.id] || {})[k];
function mSummary(m) {
  const ser = series(m), last = ser.length ? ser[ser.length - 1].v : null, s0 = startOf(m);
  const ch = last != null && s0 != null ? last - s0 : null;
  const goal = m.goal_value != null && m.goal_value !== '' && !isNaN(m.goal_value) ? +m.goal_value : null;
  const good = ch == null || m.direction === 'keep' ? null : (m.direction === 'down' ? ch < 0 : ch > 0);
  let prog = null; if (goal != null && s0 != null && last != null && s0 !== goal && m.direction !== 'keep') prog = Math.max(0, Math.min(100, Math.round((s0 - last) / (s0 - goal) * 100)));

}

function upsertLog(h, k, patch) {
  const l = logOf(h, k);
  if (l) update('habit_logs', l.id, patch);
  else insert('habit_logs', Object.assign({ habit_id: h.id, user_id: idx.u.id, log_date: k, status: 'done', value: null, completed_at: nowIso(), source: 'today' }, patch));
}
function removeLog(h, k) { hardDelete('habit_logs', l => l.habit_id === h.id && l.log_date === k); }
function afterChange(h, k, wasDone) {
  buildIndex();
  if (k !== todayK() || wasDone || !isDone(h, k)) return;
  const s = streakOf(h), best = bestOf(h);
  if (MILESTONES.includes(s) && !rows('user_milestones', m => m.habit_id === h.id && m.milestone_days === s).length) insert('user_milestones', { user_id: idx.u.id, habit_id: h.id, milestone_days: s, achieved_on: k, shared_at: null });
  const next = MILESTONES.find(m => m > s) || s + 30;
  let note = '';
  if (h.type === 'count') note = fmt(valOf(h, k)) + ' de ' + fmt(h.target_value) + ' ' + h.unit;
  if (h.type === 'measure') {
    const m = metricsOf(h)[0]; if (m) { const ser = series(m), t = ser.find(p => p.k === k); if (t) { const prev = ser.filter(p => p.k < k).map(p => p.v); if (prev.length && ((m.direction === 'down' && t.v < Math.min(...prev)) || (m.direction === 'up' && t.v > Math.max(...prev)))) note = 'Nuevo récord: ' + fmt(t.v) + ' ' + m.unit; } }
  }
  state.award = { name: h.name, streak: s, best: s >= best, next, note };
}
function toggleCheck(h, k) {
  const was = isDone(h, k);
  if (was) removeLog(h, k); else upsertLog(h, k, { status: 'done', value: null, completed_at: nowIso() });
  afterChange(h, k, was);
}
function setCount(h, k, v) {
  const was = isDone(h, k);
  v = Math.max(0, Math.round(v * 10) / 10);
  if (!v) removeLog(h, k); else upsertLog(h, k, { value: v, status: v >= h.target_value ? 'done' : 'partial', completed_at: nowIso() });
  afterChange(h, k, was);
}
function setMeasures(h, k, valsByMetric) {
  const was = isDone(h, k);
  let any = false;
  metricsOf(h).forEach(m => {
    const v = valsByMetric[m.id];
    const ex = rows('habit_measurements', x => x.metric_id === m.id && x.measured_on === k)[0];
    if (v == null || isNaN(v)) { if (ex) hardDelete('habit_measurements', x => x.id === ex.id); return; }
    any = true;
    if (ex) update('habit_measurements', ex.id, { value: v, measured_at: nowIso() });
    else insert('habit_measurements', { metric_id: m.id, habit_id: h.id, user_id: idx.u.id, measured_on: k, value: v, measured_at: nowIso(), note: null });
  });
  if (any) upsertLog(h, k, { status: 'done', value: null, completed_at: nowIso() }); else removeLog(h, k);
  afterChange(h, k, was);
}
function dayAction(h, k) { if (h.type === 'check') { toggleCheck(h, k); state.flash = h.id + k; render(); } else openLog(h.id, k); }

  }
  if (id === 'noteForm') { const t = state.noteDraft.trim(); if (!t) return; insert('habit_notes', { habit_id: state.detailId, user_id: idx.u.id, note_date: todayK(), body: t }); state.noteDraft = ''; render(); }
  if (id === 'jForm') { const t = state.jDraft.trim(); if (!t) { state.jMsg = 'Escribí algo primero'; render(); return; } const p = PROMPTS[state.pq]; insert('journal_entries', { user_id: idx.u.id, entry_date: todayK(), prompt_id: p.id, prompt_text: p.text, body: t, mood: null }); state.jDraft = ''; state.jMsg = 'Guardado'; render(); }
  if (id === 'logForm') saveLog(false);
  if (id === 'taskForm') {
    const sd = state.sd; if (!(sd.title || '').trim()) { sd.err = 'Escribí qué tenés que hacer.'; renderLayer(); return; }
    const rec = sd.rec || 'once', d0 = dayOff(0);
    insert('tasks', { user_id: idx.u.id, title: sd.title.trim(), kind: rec === 'once' ? 'one_off' : 'recurring', in_my_control: sd.ctrl || 'yes', due_date: rec === 'once' ? todayK() : null, due_time: null,
      recurrence_rule: rec === 'weekly' ? 'FREQ=WEEKLY;BYDAY=' + ['SU','MO','TU','WE','TH','FR','SA'][d0.getDay()] : rec === 'monthly' ? 'FREQ=MONTHLY;BYMONTHDAY=' + d0.getDate() : null,
      recurrence_label: rec === 'weekly' ? 'Cada ' + WDL[d0.getDay()].toLowerCase() : rec === 'monthly' ? 'Día ' + d0.getDate() + ' de cada mes' : null, sort_order: idx.tasks.length });
    state.taskTab = rec === 'once' ? 'one_off' : 'recurring'; closeSheet(() => { render(); toast('Tarea agregada'); });
  }
  if (id === 'newForm') {
    const n = state.newH;
    if (!n.name.trim()) { n.err = 'Dale un nombre a tu práctica.'; render(); return; }
    let target = null;
    if (n.type === 'count') { target = num(n.target); if (isNaN(target) || target <= 0) { n.err = 'Poné una meta diaria mayor que cero.'; render(); return; } }
    const ms = n.type === 'measure' ? n.metrics.filter(m => (m.name || '').trim()) : [];
    if (n.type === 'measure' && !ms.length) { n.err = 'Agregá al menos una variable con nombre, por ejemplo Peso.'; render(); return; }
    const hab = insert('habits', { user_id: idx.u.id, name: n.name.trim(), type: n.type, virtue: n.virtue, symbol: n.symbol, frequency_type: 'daily', frequency_days: null, target_value: target, unit: n.type === 'count' ? (n.unit.trim() || 'veces') : null, template_key: n.tpl || null, sort_order: idx.habits.length, start_date: todayK(), archived_at: null });
    if (n.remind && n.remindAt) insert('habit_reminders', { habit_id: hab.id, remind_at: n.remindAt, days: null, enabled: true });
    ms.forEach((m, i) => { const s = num(m.start_value), g = num(m.goal_value); insert('habit_metrics', { habit_id: hab.id, name: m.name.trim(), unit: (m.unit || '').trim(), direction: m.direction, start_value: isNaN(s) ? null : s, goal_value: isNaN(g) ? null : g, step: stepOf(m.unit, 'measure'), position: i, archived_at: null }); });
    state.newH = null; go('habits'); toast('Hábito creado');
  }
});

render();
})();
</script>

</body>
</html>
