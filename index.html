<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Stoica</title>
    <meta name="description" content="Hábitos. Disciplina. Una vida más serena." />
    <meta name="theme-color" content="#ECE6DB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090909" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stoica" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" />
    <script>
      // Aplica el tema guardado antes de pintar, para que no parpadee.
      try {
        var t = localStorage.getItem('stoica.tema');
        if (t === 'claro') document.documentElement.setAttribute('data-theme', 'light');
        if (t === 'oscuro') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <noscript>Stoica necesita JavaScript activado.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
